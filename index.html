<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#6a823e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="ACNHEX Market — Browse ACNH items and generate Discord order bot commands">
  <title>ACNHEX Market</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍃</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%236a823e' width='100' height='100' rx='20'/><text x='50' y='65' text-anchor='middle' font-size='60'>🍃</text></svg>">
  <link rel="stylesheet" href="css/styles.css?v=23">
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading-screen" class="loading-screen">
    <div class="ls-particle">🍃</div>
    <div class="ls-particle">🌿</div>
    <div class="ls-particle">🍃</div>
    <div class="ls-particle">🌿</div>
    <div class="ls-particle">🍃</div>
    <div class="ls-particle">🌿</div>
    <div class="ls-container">
      <div class="ls-logo-wrapper">
        <div class="ls-leaf-glow"></div>
        <span class="ls-leaf-emoji">🌿</span>
      </div>
      <div class="ls-title">ACNHEX Market</div>
      <div class="ls-subtitle">Nook Inc. Official</div>
      <div class="ls-progress-section">
        <div class="ls-progress-track">
          <div class="ls-progress-fill"></div>
        </div>
        <div class="ls-message-wrapper">
          <span class="ls-message">Checking Nook's inventory...</span>
          <span class="ls-message">Shaking trees for items...</span>
          <span class="ls-message">Asking Isabelle for permission...</span>
          <span class="ls-message">Loading 25,000+ items...</span>
        </div>
      </div>
      <div class="ls-dots">
        <div class="ls-dot"></div>
        <div class="ls-dot"></div>
        <div class="ls-dot"></div>
      </div>
    </div>
    <div class="ls-receipt-edge">
      <div class="ls-nook-certified">Nook Inc. Certified</div>
    </div>
    <div class="ls-version">v2.0.8</div>
  </div>

  <div id="app"></div>
  <script type="module" src="js/app.js?v=23"></script>
  <script>
  if ('serviceWorker' in navigator) {
    // Force clear old service workers and caches, then re-register
    navigator.serviceWorker.getRegistrations().then(regs => {
      Promise.all(regs.map(r => r.unregister())).then(() => {
        caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k)))).then(() => {
          navigator.serviceWorker.register('sw.js?v=23');
        });
      });
    });
  }
  </script>
</body>
</html>
